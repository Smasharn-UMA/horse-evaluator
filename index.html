<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Horse Evaluator 3.0</title><link rel="stylesheet" href="style.css"></head><body>
<header class="app-header"><div><div class="eyebrow">Horse Evaluator</div><h1>3.0 Core <span>Sprint 1</span></h1></div><button id="newHorseBtn" class="primary">＋ 募集馬を登録</button></header>
<main class="layout"><aside class="sidebar"><section class="panel"><h2>表示条件</h2><label>年度<select id="yearFilter"></select></label><label>クラブ<select id="clubFilter"></select></label><label>検索<input id="searchInput" type="search" placeholder="馬名・父・母・厩舎"></label><label>並び順<select id="sortSelect"><option value="horseNo">募集番号順</option><option value="updatedAt">更新日順</option><option value="name">馬名順</option><option value="price">募集価格順</option></select></label><label class="check-row"><input id="favoriteOnly" type="checkbox">お気に入りのみ</label></section>
<section class="panel"><h2>データ管理</h2><button id="exportBtn">JSONバックアップ</button><label class="file-button">JSON復元<input id="importInput" type="file" accept=".json,application/json"></label><button id="seedBtn" class="secondary">サンプルを追加</button><button id="clearBtn" class="danger ghost">全データ削除</button><p class="muted">保存先：この端末のブラウザ</p></section></aside>
<section class="content"><section id="dashboard" class="dashboard"></section><div class="section-title"><h2>募集馬一覧</h2><span id="resultCount"></span></div><section id="horseList" class="horse-grid"></section><div id="emptyState" class="empty hidden"><h3>登録馬がありません</h3><p>「募集馬を登録」から最初の1頭を追加してください。</p></div></section></main>
<dialog id="horseDialog"><form id="horseForm" method="dialog"><div class="dialog-head"><div><div class="eyebrow">募集馬カルテ</div><h2 id="dialogTitle">新規登録</h2></div><button type="button" id="closeDialogBtn" class="icon-btn">×</button></div><input type="hidden" id="horseId"><div class="form-grid">
<label>年度 *<input id="year" type="number" min="2000" max="2100" required></label><label>クラブ *<select id="club" required><option>キャロット</option><option>シルク</option><option>ユニオン</option><option>その他</option></select></label><label>募集番号<input id="horseNo" type="number" min="1"></label><label>馬名・募集名 *<input id="name" required></label><label>性別<select id="sex"><option value="">未設定</option><option>牡</option><option>牝</option><option>せん</option></select></label><label>生年月日<input id="birthDate" type="date"></label><label>父<input id="sire"></label><label>母<input id="dam"></label><label>母父<input id="broodmareSire"></label><label>厩舎<input id="trainer"></label><label>生産牧場<input id="breeder"></label><label>育成牧場<input id="trainingFarm"></label><label>募集総額（万円）<input id="price" type="number" min="0"></label><label>一口価格（円）<input id="sharePrice" type="number" min="0" step="1000"></label></div>
<fieldset><legend>募集時測尺</legend><div class="form-grid four"><label>馬体重（kg）<input id="weight" type="number"></label><label>体高（cm）<input id="height" type="number" step="0.1"></label><label>胸囲（cm）<input id="girth" type="number" step="0.1"></label><label>管囲（cm）<input id="cannon" type="number" step="0.1"></label></div></fieldset>
<fieldset><legend>管理情報</legend><div class="form-grid"><label>カタログ写真URL<input id="photoUrl" type="url" placeholder="https://..."></label><label>歩様動画URL<input id="videoUrl" type="url" placeholder="https://..."></label></div><label>メモ<textarea id="notes" rows="5"></textarea></label><label class="check-row"><input id="favorite" type="checkbox">お気に入り</label></fieldset><div class="dialog-actions"><button type="button" id="cancelBtn" class="secondary">キャンセル</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="detailDialog"><div id="detailContent"></div><div class="dialog-actions"><button id="detailCloseBtn" class="secondary">閉じる</button></div></dialog><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
