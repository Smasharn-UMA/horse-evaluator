<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18392b" />
  <title>Horse Evaluator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">一口馬主 出資判断ツール</p>
      <h1>Horse Evaluator</h1>
    </div>
    <button id="resetBtn" class="ghost-btn" type="button">入力をリセット</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>基本情報</h2>
      <div class="grid two">
        <label>
          馬名
          <input id="horseName" type="text" placeholder="例：○○の2025" />
        </label>
        <label>
          クラブ
          <select id="club">
            <option value="">選択してください</option>
            <option>キャロットクラブ</option>
            <option>シルク・ホースクラブ</option>
            <option>日高ブリーダーズユニオン</option>
            <option>その他</option>
          </select>
        </label>
        <label>
          性別
          <select id="sex">
            <option value="">選択してください</option>
            <option>牡馬</option>
            <option>牝馬</option>
            <option>せん馬</option>
          </select>
        </label>
        <label>
          生年月日
          <input id="birthDate" type="date" />
        </label>
      </div>
    </section>

    <section class="card">
      <h2>測尺</h2>
      <div class="grid four">
        <label>
          馬体重（kg）
          <input id="weight" type="number" inputmode="decimal" min="0" step="0.1" />
        </label>
        <label>
          体高（cm）
          <input id="height" type="number" inputmode="decimal" min="0" step="0.1" />
        </label>
        <label>
          胸囲（cm）
          <input id="chest" type="number" inputmode="decimal" min="0" step="0.1" />
        </label>
        <label>
          管囲（cm）
          <input id="cannon" type="number" inputmode="decimal" min="0" step="0.1" />
        </label>
      </div>
      <p class="hint">数値を入力すると、初期版の簡易基準で自動評価します。</p>
    </section>

    <section class="card">
      <h2>写真・歩様動画</h2>
      <div class="grid two">
        <div>
          <label class="file-label">
            立ち写真を選択
            <input id="photoInput" type="file" accept="image/*" />
          </label>
          <div id="photoPreview" class="media-preview empty">写真未選択</div>
        </div>
        <div>
          <label class="file-label">
            歩様動画を選択
            <input id="videoInput" type="file" accept="video/*" />
          </label>
          <div id="videoPreview" class="media-preview empty">動画未選択</div>
        </div>
      </div>
      <p class="hint">選択した写真・動画はこの端末上でのみ表示され、GitHubへ自動送信されません。</p>
    </section>

    <section class="card">
      <h2>主観評価</h2>
      <div class="score-grid">
        <label>トモの容量 <input id="hindquarter" type="range" min="1" max="5" value="3" /><span data-for="hindquarter">3</span></label>
        <label>歩様の柔軟性 <input id="flexibility" type="range" min="1" max="5" value="3" /><span data-for="flexibility">3</span></label>
        <label>踏み込み <input id="stride" type="range" min="1" max="5" value="3" /><span data-for="stride">3</span></label>
        <label>前後の連動性 <input id="coordination" type="range" min="1" max="5" value="3" /><span data-for="coordination">3</span></label>
        <label>成長余地 <input id="growth" type="range" min="1" max="5" value="3" /><span data-for="growth">3</span></label>
      </div>
    </section>

    <section class="card">
      <h2>メモ</h2>
      <textarea id="notes" rows="6" placeholder="血統、厩舎、母年齢、脚元、気性、価格など"></textarea>
    </section>

    <section class="card result-card">
      <div class="result-heading">
        <div>
          <p class="eyebrow">簡易総合判定</p>
          <h2 id="resultTitle">未評価</h2>
        </div>
        <div id="totalScore" class="score-circle">--</div>
      </div>
      <div id="resultDetails" class="result-details">
        測尺と主観評価を入力すると判定を表示します。
      </div>
      <div class="actions">
        <button id="evaluateBtn" class="primary-btn" type="button">評価する</button>
        <button id="saveBtn" class="secondary-btn" type="button">端末に保存</button>
        <button id="exportBtn" class="secondary-btn" type="button">JSONを書き出す</button>
      </div>
    </section>

    <section class="card">
      <div class="saved-header">
        <h2>保存済みデータ</h2>
        <button id="clearSavedBtn" class="ghost-btn danger" type="button">全削除</button>
      </div>
      <div id="savedList" class="saved-list">保存データはありません。</div>
    </section>
  </main>

  <footer>
    <p>Horse Evaluator 初期版 v1.0</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
